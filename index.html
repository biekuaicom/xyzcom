<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO 优化 -->
    <meta name="description" content="别快智控-智能多功能响应式导航。提供高效的搜索、云端自定义网址管理、动态天气与专属壁纸等个性化功能。">
    <meta name="keywords" content="网址导航, 别快智控, 开发者导航, 智能导航, 响应式网站, 云端同步">
    
    <title id="page-title">科别快智控-智能多功能响应式导航</title>
    
    <!-- 性能优化：DNS 预解析与预连接 -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    
    <!-- Google AdSense 基础脚本 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 日间模式 (Light) 基础样式 */
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.theme-light .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .glass-input {
            background: rgba(0, 0, 0, 0.04);
            color: #000;
        }
        body.theme-light input::placeholder { color: #94a3b8; }
        body.theme-light #engine-menu { background: #ffffff; border-color: #e2e8f0; }
        body.theme-light #engine-menu button { color: #334155; }
        body.theme-light #engine-menu button:hover { background: rgba(79, 70, 229, 0.08); }

        /* 夜间模式 (Dark) 基础样式 */
        body.theme-dark {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
        }
        body.theme-dark .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body.theme-dark .glass-input {
            background: rgba(255, 255, 255, 0.07);
        }

        /* 自定义壁纸激活状态的遮罩 */
        body.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* 全局过渡动画与拖拽交互支持 */
        body, .glass-card, .glass-input, #custom-links-container {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
            border: 2px dashed #6366f1 !important;
        }

        /* 区域快捷导航 */
        .area-nav-button {
            --area-color: #6366f1;
            background: var(--area-color);
            border: 2px solid transparent;
            color: #fff;
            box-shadow: 0 6px 14px color-mix(in srgb, var(--area-color) 28%, transparent);
        }
        .area-nav-button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .area-nav-button.is-active {
            background: color-mix(in srgb, var(--area-color) 78%, #0f172a);
            border-color: #fff;
            outline: 3px solid var(--area-color);
            outline-offset: 2px;
        }
        .area-card-active {
            border: 2px solid var(--active-area-color, #6366f1) !important;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--active-area-color, #6366f1) 22%, transparent),
                        0 20px 25px -5px rgba(0, 0, 0, 0.3) !important;
        }

        /* 管理员权限控制类：默认非管理员隐藏编辑元素 */
        body:not(.is-admin) .admin-only {
            display: none !important;
        }
    </style>
</head>
<body class="theme-dark font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 个性化设置浮窗 -->
    <div class="fixed top-5 right-5 z-[150] relative">
        <button aria-label="个性化设置" onclick="toggleThemeMenu(event)" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-indigo-500 hover:scale-105 active:scale-95 transition-all shadow-lg cursor-pointer" title="个性化设置">
            <i id="theme-icon" class="fas fa-palette text-sm"></i>
        </button>
        <div id="theme-panel" class="absolute right-0 top-full mt-2 w-80 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-slate-900/95 border border-slate-700/80 rounded-2xl shadow-2xl hidden backdrop-blur-md p-4 space-y-3 z-[160]" onclick="event.stopPropagation()">
            <div class="text-[11px] font-bold text-slate-400 px-1 mb-1.5" data-i18n="langTitle">语言 / Language</div>
            <div class="flex gap-2 mb-3 border-b border-slate-800 pb-3">
                <button onclick="setLanguage('zh')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">中文</button>
                <button onclick="setLanguage('en')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">English</button>
            </div>

            <div class="text-[11px] font-bold text-slate-400 px-1" data-i18n="themeTitle">基础色彩模式 (本地偏好)</div>
            <div class="flex gap-2">
                <button onclick="setBaseTheme('theme-light')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-sun text-amber-500"></i> <span data-i18n="themeLight">日间</span></button>
                <button onclick="setBaseTheme('theme-dark')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-moon text-indigo-400"></i> <span data-i18n="themeDark">夜间</span></button>
            </div>
            
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] text-slate-400 font-bold" data-i18n="bgTitle">自定义背景 (全站同步)</label>
                    <button onclick="clearCustomBg()" id="clear-bg-btn" class="text-[10px] text-red-400 hover:underline hidden" data-i18n="clearBg">清除壁纸</button>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="custom-bg-input" data-i18n-placeholder="bgInputPlace" placeholder="输入图片网址 https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="applyCustomBg()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0" data-i18n="applyBtn">应用</button>
                </div>
            </div>
            
            <!-- 【新增】修改管理员密码区域 (仅管理员可见) -->
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <label class="text-[11px] text-slate-400 font-bold" data-i18n="pwdTitle">修改管理员密码 (全站同步)</label>
                <div class="flex gap-1.5">
                    <input type="password" id="custom-pwd-input" data-i18n-placeholder="pwdInputPlace" placeholder="输入新密码" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    <button onclick="updateAdminPwd()" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-emerald-500 cursor-pointer shrink-0" data-i18n="saveBtn">保存</button>
                </div>
            </div>

            <div class="admin-only space-y-2 border-t border-slate-800 pt-3 mt-1">
                <div class="text-[11px] text-slate-400 font-bold" data-i18n="restoreTitle">站点恢复点</div>
                <div class="grid grid-cols-2 gap-1.5">
                    <input type="text" id="restore-name" data-i18n-placeholder="restoreNamePlace" placeholder="恢复点名称" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                    <input type="date" id="restore-date" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>
                <textarea id="restore-note" data-i18n-placeholder="restoreNotePlace" placeholder="备注（可选）" rows="2" class="w-full resize-none bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"></textarea>
                <button type="button" onclick="createSiteRestorePoint()" class="w-full py-1.5 rounded-lg bg-cyan-600/20 border border-cyan-500/30 text-cyan-300 text-[11px] hover:bg-cyan-600/35 transition-colors cursor-pointer" data-i18n="createRestore">创建站点恢复点</button>
                <div class="flex gap-1.5">
                    <select id="restore-point-list" class="min-w-0 flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-[11px] text-slate-200 focus:outline-none focus:border-cyan-500"></select>
                    <button type="button" onclick="restoreSavedPoint()" class="shrink-0 px-2.5 py-1.5 rounded-lg bg-amber-600/20 border border-amber-500/30 text-amber-300 text-[11px] hover:bg-amber-600/35 cursor-pointer" data-i18n="restoreSaved">恢复</button>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <button type="button" onclick="exportCurrentRestorePoint()" class="py-1.5 rounded-lg bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 text-[11px] hover:bg-indigo-600/35 cursor-pointer" data-i18n="exportRestore">导出当前状态</button>
                    <button type="button" onclick="document.getElementById('restore-file-input').click()" class="py-1.5 rounded-lg bg-emerald-600/20 border border-emerald-500/30 text-emerald-300 text-[11px] hover:bg-emerald-600/35 cursor-pointer" data-i18n="importRestore">导入恢复点</button>
                </div>
                <input type="file" id="restore-file-input" accept=".json,application/json" class="hidden" onchange="importRestorePoint(event)">
            </div>

            <div class="admin-only border-t border-slate-800 pt-2 mt-2">
                <button onclick="logoutAdmin()" class="w-full py-1.5 rounded-lg bg-red-950/40 border border-red-900/40 text-red-400 text-[11px] text-center hover:bg-red-900/40 transition-colors cursor-pointer" data-i18n="logoutBtn">退出后台管理</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-12 lg:py-20 flex flex-col items-center">
        
        <!-- 时间与问候语组件 -->
        <div class="text-center mb-10 animate-fade-in">
            <h1 id="clock" class="text-5xl lg:text-7xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 mb-2">00:00:00</h1>
            <div class="flex items-center justify-center space-x-3 text-sm md:text-base font-medium tracking-wide opacity-90">
                <span id="greeting" class="text-indigo-400">正在筹备问候语...</span>
                <span class="opacity-30">|</span>
                <span id="weather-info" class="flex items-center gap-1.5 text-emerald-400">
                    <i class="fas fa-spinner fa-spin text-xs"></i> <span data-i18n="weatherLoading">正在定位测算天气...</span>
                </span>
            </div>
        </div>

        <!-- 搜索引擎组件 -->
        <div class="w-full max-w-2xl mb-6 relative z-[100]">
            <form id="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" class="relative">
                <div class="flex items-center glass-input rounded-2xl border border-slate-700/40 shadow-2xl focus-within:border-indigo-500/80 transition-all duration-300">
                    <div class="relative pl-4">
                        <button type="button" aria-label="切换搜索引擎" id="engine-btn" onclick="toggleEngineMenu(event)" class="flex items-center space-x-2 text-slate-400 hover:text-indigo-400 transition-colors py-4 pr-2 cursor-pointer">
                            <i id="engine-icon" class="fab fa-google text-blue-400"></i>
                            <i class="fas fa-chevron-down text-xs opacity-50"></i>
                        </button>
                        <div id="engine-menu" class="absolute left-2 top-full mt-2 w-36 bg-slate-950/95 border border-slate-800 rounded-xl shadow-2xl hidden backdrop-blur-md overflow-hidden z-[110]">
                            <button type="button" onclick="selectEngine('google')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-google text-blue-400"></i> <span data-i18n="enGoogle">谷歌 Google</span></button>
                            <button type="button" onclick="selectEngine('bing')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-microsoft text-teal-400"></i> <span data-i18n="enBing">必应 Bing</span></button>
                            <button type="button" onclick="selectEngine('baidu')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-paw text-red-400"></i> <span data-i18n="enBaidu">百度 Baidu</span></button>
                            <button type="button" onclick="selectEngine('github')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-github text-slate-400"></i> <span>GitHub</span></button>
                        </div>
                    </div>
                    <input type="text" id="search-input" name="q" data-i18n-placeholder="searchGoogle" placeholder="在 Google 中搜索..." autocomplete="off" class="w-full bg-transparent border-none py-4 px-3 focus:outline-none focus:ring-0 text-base">
                    <button type="submit" aria-label="搜索" class="mr-3 p-2.5 text-slate-400 hover:text-indigo-400 transition-colors">
                        <i class="fas fa-search text-lg"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- 导航卡片网格 -->
        <nav aria-label="区域导航" class="w-full mb-8 relative z-20">
            <div id="area-navigation" class="glass-card rounded-2xl px-4 py-3 flex flex-wrap items-center justify-center sm:justify-start gap-2.5">
                <button type="button" class="area-nav-button shrink-0 rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all" style="--area-color:#4f46e5" data-area-target="card-recommend" onclick="activateArea('card-recommend', this)">
                    <i class="fas fa-star mr-1.5"></i><span data-i18n="cardRec">常用推荐</span>
                </button>
                <button type="button" class="area-nav-button shrink-0 rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all" style="--area-color:#9333ea" data-area-target="card-develop" onclick="activateArea('card-develop', this)">
                    <i class="fas fa-code mr-1.5"></i><span data-i18n="cardDev">效率与开发</span>
                </button>
                <button type="button" class="area-nav-button shrink-0 rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all" style="--area-color:#db2777" data-area-target="card-custom" onclick="activateArea('card-custom', this)">
                    <i class="fas fa-folder-plus mr-1.5"></i><span data-i18n="cardCustom">站长推荐</span>
                </button>
                <div id="dynamic-area-navigation" class="contents"></div>
            </div>
        </nav>

        <div id="main-nav-grid" class="w-full grid grid-cols-1 xl:grid-cols-3 gap-8 mb-8 relative z-10 items-start">
            
            <div id="card-recommend" class="glass-card rounded-2xl p-6 shadow-xl hover:border-indigo-500/30 transition-all duration-300">
                <h3 class="text-lg font-semibold text-indigo-400 mb-4 flex items-center"><i class="fas fa-star mr-2.5"></i> <span data-i18n="cardRec">常用推荐</span></h3>
                <div class="grid grid-cols-2 gap-3">
                    <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-indigo-600/20 transition-all"><i class="fab fa-github text-xl text-slate-400"></i> <span class="text-sm font-medium">GitHub</span></a>
                    <a href="https://www.youtube.com/@kejigongxiang" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-indigo-600/20 transition-all"><i class="fab fa-youtube text-xl text-red-500"></i> <span class="text-sm font-medium">YouTube</span></a>
                    <a href="https://www.douyin.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-indigo-600/20 transition-all"><i class="fas fa-globe text-xl text-blue-400"></i> <span class="text-sm font-medium" data-i18n="linkBlog">抖音</span></a>
                    <a href="https://x.com/kejigongxiang" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-indigo-600/20 transition-all"><i class="fas fa-tv text-xl text-pink-400"></i> <span class="text-sm font-medium" data-i18n="linkBili">哔哩哔哩</span></a>
                    <a href="https://www.zhihu.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-indigo-600/20 transition-all"><i class="fab fa-zhihu text-xl text-blue-500"></i> <span class="text-sm font-medium" data-i18n="linkZhihu">知乎</span></a>
                    <a href="https://weibo.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-indigo-600/20 transition-all"><i class="fab fa-weibo text-xl text-red-400"></i> <span class="text-sm font-medium" data-i18n="linkWeibo">微博</span></a>
                </div>
            </div>

            <div id="card-develop" class="glass-card rounded-2xl p-6 shadow-xl hover:border-purple-500/30 transition-all duration-300">
                <h3 class="text-lg font-semibold text-purple-400 mb-4 flex items-center"><i class="fas fa-code mr-2.5"></i> <span data-i18n="cardDev">效率与开发</span></h3>
                <div class="grid grid-cols-2 gap-3">
                    <a href="https://dash.cloudflare.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-purple-600/20 transition-all"><i class="fas fa-cloud text-xl text-orange-400"></i> <span class="text-sm font-medium">Cloudflare</span></a>
                    <a href="https://chatgpt.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-purple-600/20 transition-all"><i class="fas fa-robot text-xl text-emerald-400"></i> <span class="text-sm font-medium">ChatGPT</span></a>
                    <a href="https://juejin.cn" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-purple-600/20 transition-all"><i class="fas fa-book text-xl text-blue-500"></i> <span class="text-sm font-medium" data-i18n="linkJuejin">稀土掘金</span></a>
                    <a href="https://vercel.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-purple-600/20 transition-all"><i class="fas fa-triangle-exclamation text-xl"></i> <span class="text-sm font-medium">Vercel</span></a>
                    <a href="https://stackoverflow.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-purple-600/20 transition-all"><i class="fab fa-stack-overflow text-xl text-orange-500"></i> <span class="text-sm font-medium">StackOverflow</span></a>
                    <a href="https://caniuse.com" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-purple-600/20 transition-all"><i class="fas fa-browser text-xl text-sky-400"></i> <span class="text-sm font-medium">CanIUse</span></a>
                </div>
            </div>

            <div id="card-custom" class="glass-card rounded-2xl p-6 shadow-xl hover:border-pink-500/30 transition-all duration-300 xl:col-span-1">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-pink-400 flex items-center"><i class="fas fa-folder-plus mr-2.5"></i> <span data-i18n="cardCustom">站长推荐</span></h3>
                    <div class="admin-only flex gap-1.5">
                        <button type="button" onclick="openTextEditor('custom')" class="text-xs px-2.5 py-1 bg-amber-600/20 text-amber-300 border border-amber-500/20 rounded-lg hover:bg-amber-600/40 transition-colors cursor-pointer z-[50]" data-i18n="addText">添加文本</button>
                        <button type="button" onclick="openLinkModal('custom')" class="text-xs px-2.5 py-1 bg-pink-600/20 text-pink-400 border border-pink-500/20 rounded-lg hover:bg-pink-600/40 transition-colors cursor-pointer z-[50]" data-i18n="addCloud">添加 (云端)</button>
                    </div>
                </div>
                <div id="custom-links-container"></div>
                <div id="expand-action-wrapper" class="mt-4 pt-2 border-t border-slate-500/10 text-center hidden">
                    <button onclick="toggleExpandCustomLinks()" id="expand-btn" class="text-xs font-semibold text-pink-400 hover:text-pink-300 transition-colors cursor-pointer inline-flex items-center gap-1">
                        <span data-i18n="expandMore">展开显示更多</span> <i class="fas fa-chevron-down text-[10px]"></i>
                    </button>
                </div>

        };

        function getLocalizedLinkName(originalName, url) {
            if (url && dynamicLinkDict[url]) return dynamicLinkDict[url][currentLang];
            return originalName;
        }
        function escapeAttribute(value) {
            return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        }
        function createLinkIcon(link, displayName, sizeClass, textSizeClass) {
            let iconUrl = link.iconUrl || '';
            if (!iconUrl) {
                try { iconUrl = `https://unavatar.io/duckduckgo/${new URL(link.url).hostname}`; } catch (error) {}
            }
            const initial = escapeAttribute((displayName || '?').charAt(0).toUpperCase());
            const image = iconUrl
                ? `<img src="${escapeAttribute(iconUrl)}" draggable="false" onerror="this.remove()" class="absolute inset-0 w-full h-full rounded object-contain bg-slate-800" alt="" />`
                : '';
            return `<div class="${sizeClass} relative rounded shrink-0">
                <span class="absolute inset-0 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold ${textSizeClass}">${initial}</span>
                ${image}

        }
        function t(key) { return i18n[currentLang][key] || key; }

        // --- 1. 管理员鉴权 (动态密码校验) ---
        function checkAdminSession() {
            const isAdmin = localStorage.getItem('nav_admin_auth') === 'true';
            if (isAdmin) { document.body.classList.add('is-admin'); document.getElementById('admin-badge').classList.remove('hidden'); } 
            else { document.body.classList.remove('is-admin'); document.getElementById('admin-badge').classList.add('hidden'); }
        }
        
        function triggerAdminLogin() {
            if (localStorage.getItem('nav_admin_auth') === 'true') { alert(currentLang === 'zh' ? "提示：您已处于后台管理模式。" : "Notice: You are already in admin mode."); return; }

            if (pwd === null) return;
            
            // 【关键】：校验密码时优先使用云端配置，如果没有则使用初始密码 admin888
            const currentValidPwd = cloudConfig.adminPwd || "admin888";
            
            if (pwd === currentValidPwd) { 
                localStorage.setItem('nav_admin_auth', 'true'); alert(t('pwdSuccess')); checkAdminSession(); 
            } 
            else { alert(t('pwdFail')); }
        }

        async function updateAdminPwd() {
            const newPwd = document.getElementById('custom-pwd-input').value.trim();
            if (!newPwd) return;
            cloudConfig.adminPwd = newPwd;
            document.getElementById('custom-pwd-input').value = '';
            document.getElementById('theme-panel').classList.add('hidden');
            
            try { 
                await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cloudConfig) }); 
                alert(t('pwdUpdateSuccess'));
            } catch (e) { 
                console.error("云端密码同步失败", e); 
            }
        }

        // --- 2. 拖拽核心控制逻辑 ---
        function handleDragStart(e, type, secId, linkIdx = null) {
            e.stopPropagation(); 
            if (localStorage.getItem('nav_admin_auth') !== 'true') { e.preventDefault(); return; }
            dragType = type; dragSecId = secId; dragLinkIdx = linkIdx;
            e.dataTransfer.effectAllowed = 'move';
            const target = e.currentTarget;
            setTimeout(() => target.classList.add('dragging'), 0);
        }

        function handleDragEnd(e) {
            e.stopPropagation(); 
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.dynamic-section-card, .group').forEach(el => el.style.border = '');
        }

        function handleDragOver(e, type) { 
            e.preventDefault(); 
            e.stopPropagation(); 
            e.dataTransfer.dropEffect = 'move'; 
            return false; 
        }

        function handleDrop(e, type, targetSecId, targetLinkIdx = null) {
            e.stopPropagation(); 
            e.preventDefault();
            if (localStorage.getItem('nav_admin_auth') !== 'true') return;

            let secs = cloudConfig.dynamicSections || [];

            if (dragType === 'section' && type === 'section') {
                if (dragSecId === targetSecId) return;
                const fromIdx = secs.findIndex(s => s.id === dragSecId);
                const toIdx = secs.findIndex(s => s.id === targetSecId);
                if(fromIdx > -1 && toIdx > -1) {
                    const [moved] = secs.splice(fromIdx, 1);
                    secs.splice(toIdx, 0, moved);
                }
            } 
            else if (dragType === 'link' && type === 'link') {
                if (dragSecId === targetSecId && dragLinkIdx === targetLinkIdx) return;
                const fromSec = secs.find(s => s.id === dragSecId);
                const toSec = secs.find(s => s.id === targetSecId);
                if (fromSec && toSec) {
                    let actualTargetIdx = targetLinkIdx;
                    const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                    toSec.links.splice(actualTargetIdx, 0, movedLink);
                }
            } 
            else if (dragType === 'link' && type === 'section') {
                 const fromSec = secs.find(s => s.id === dragSecId);
                 const toSec = secs.find(s => s.id === targetSecId);
                 if (fromSec && toSec) {
                     if (fromSec === toSec) return; 
                     const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                     toSec.links.push(movedLink);
                 }
            }
            saveDynamicSections(secs);
        }

            const globalDefaultBg = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop"; 
            let savedBg = localStorage.getItem('nav_custom_wallpaper');
            cloudConfig.dynamicSections = JSON.parse(localStorage.getItem('nav_dynamic_sections') || '[]');
            
            try {

                    if (configData) {

                            if (configData.wallpaper === "") { savedBg = null; localStorage.removeItem('nav_custom_wallpaper'); document.body.classList.add('bg-cleared'); }

        async function updateCloudConfig(key, value) {

        }

        async function captureSiteSnapshot() {
            let customLinks = loadedCustomLinks.length ? loadedCustomLinks : JSON.parse(localStorage.getItem('nav_custom_links') || '[]');
            try {
                const response = await fetch('/api/links');
                if (response.ok) customLinks = await response.json();
            } catch (error) {}
            return {
                format: 'xyzcom-site-restore',
                version: 1,
                meta: {
                    name: document.getElementById('restore-name').value.trim() || `站点恢复点 ${new Date().toLocaleString()}`,
                    date: document.getElementById('restore-date').value || new Date().toISOString().slice(0, 10),
                    note: document.getElementById('restore-note').value.trim(),
                    createdAt: new Date().toISOString()
                },
                state: {

                    customLinks: JSON.parse(JSON.stringify(customLinks || [])),
                    friendLinks: JSON.parse(localStorage.getItem('nav_friend_links') || '[]'),
                    wallpaper: localStorage.getItem('nav_custom_wallpaper') || cloudConfig.wallpaper || '',

        function getSavedRestorePoints() {

        }

        function renderRestorePointList() {
            const select = document.getElementById('restore-point-list');
            if (!select) return;
            const points = getSavedRestorePoints();
            select.innerHTML = '';
            if (!points.length) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = t('noRestorePoints');
                select.appendChild(option);
                select.disabled = true;
                return;
            }
            select.disabled = false;
            points.forEach((point, index) => {

                option.textContent = `${point.meta.name} · ${point.meta.date}`;
                select.appendChild(option);

        async function createSiteRestorePoint() {
            const snapshot = await captureSiteSnapshot();
            const points = getSavedRestorePoints();
            points.unshift(snapshot);
            localStorage.setItem('nav_restore_points', JSON.stringify(points.slice(0, 20)));
            renderRestorePointList();
            alert(currentLang === 'zh' ? '恢复点已创建并保存在当前浏览器。' : 'Restore point created in this browser.');
        }

        async function exportCurrentRestorePoint() {
            const snapshot = await captureSiteSnapshot();
            const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            const safeName = snapshot.meta.name.replace(/[\\/:*?"<>|]+/g, '-').slice(0, 60) || 'xyzcom-restore';
            anchor.href = url;
            anchor.download = `${safeName}-${snapshot.meta.date}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(url);
        }

        function validateRestorePoint(snapshot) {
            return snapshot && snapshot.format === 'xyzcom-site-restore' && snapshot.state &&
                Array.isArray(snapshot.state.dynamicSections) &&
                Array.isArray(snapshot.state.customLinks) &&
                Array.isArray(snapshot.state.friendLinks);
        }

        async function applySiteSnapshot(snapshot) {
            if (!validateRestorePoint(snapshot)) {
                alert(currentLang === 'zh' ? '恢复点文件格式无效。' : 'Invalid restore point file.');
                return;
            }
            if (!confirm(currentLang === 'zh' ? '确定恢复此状态吗？当前网址和区域分类将被覆盖。' : 'Restore this state? Current links and sections will be replaced.')) return;

            const restoredConfig = {
                ...cloudConfig,
                wallpaper: snapshot.state.wallpaper || '',
                dynamicSections: snapshot.state.dynamicSections
            };
            const configResponse = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(restoredConfig)
            });
            const linksResponse = await fetch('/api/links', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(snapshot.state.customLinks)
            });
            if (!configResponse.ok || !linksResponse.ok) throw new Error('Restore request failed');

            localStorage.setItem('nav_dynamic_sections', JSON.stringify(snapshot.state.dynamicSections));
            localStorage.setItem('nav_custom_links', JSON.stringify(snapshot.state.customLinks));
            localStorage.setItem('nav_friend_links', JSON.stringify(snapshot.state.friendLinks));
            localStorage.setItem('nav_theme_mode', snapshot.state.theme || 'theme-dark');
            localStorage.setItem('nav_lang', snapshot.state.language || 'zh');
            if (snapshot.state.wallpaper) localStorage.setItem('nav_custom_wallpaper', snapshot.state.wallpaper);
            else localStorage.removeItem('nav_custom_wallpaper');
            location.reload();
        }

        }

        function activateArea(targetId, button) {

        function updateClockAndGreeting() {

        function normalizeItemName(name) {
            return String(name || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase();

        function normalizeItemUrl(url) {
            try {
                const parsed = new URL(/^https?:\/\//i.test(url) ? url : `https://${url}`);
                parsed.hash = '';
                parsed.hostname = parsed.hostname.toLowerCase();
                if (parsed.pathname !== '/') parsed.pathname = parsed.pathname.replace(/\/+$/, '');
                return parsed.toString().replace(/\/$/, '');
            } catch (error) {

            }
        }

        function findDuplicateItems(name, url, exclusion, checkUrl) {
            const normalizedName = normalizeItemName(name);
            const normalizedUrl = checkUrl ? normalizeItemUrl(url) : '';
            const conflicts = [];
            collectAllSiteItems().forEach(item => {
                if (exclusion && item.source === exclusion.source && item.index === exclusion.index) return;
                if (normalizedName && normalizeItemName(item.name) === normalizedName && !conflicts.some(entry => entry.field === 'name')) {
                    conflicts.push({ field: 'name', area: item.area });
                }
                if (checkUrl && item.type !== 'text' && item.url && normalizeItemUrl(item.url) === normalizedUrl && !conflicts.some(entry => entry.field === 'url')) {
                    conflicts.push({ field: 'url', area: item.area });
                }
            });
            return conflicts;
        }

        function showDuplicateWarning(conflicts) {
            if (!conflicts.length) return false;
            const message = conflicts.map(conflict => {
                const field = currentLang === 'zh'
                    ? (conflict.field === 'name' ? '名称' : '网址')
                    : (conflict.field === 'name' ? 'Name' : 'URL');
                return currentLang === 'zh'
                    ? `${field}已经存在于“${conflict.area}”区域，请修改后再保存。`
                    : `${field} already exists in “${conflict.area}”. Please change it before saving.`;
            }).join('\n');
            alert(message);
            return true;
        }

                actionWrapper.classList.remove('hidden'); const btn = document.getElementById('expand-btn'); 
                btn.innerHTML = isCustomLinksExpanded ? `<span data-i18n="collapseMore">${t('collapseMore')}</span> <i class="fas fa-chevron-up text-[10px]"></i>` : `<span data-i18n="expandMore">${t('expandMore')}</span> (${links.length - 9}) <i class="fas fa-chevron-down text-[10px]"></i>`; 
            } else { actionWrapper.classList.add('hidden'); }
        }

        function toggleExpandCustomLinks() { isCustomLinksExpanded = !isCustomLinksExpanded; loadCustomLinks(); }
        async function deleteCustomLink(e, index) { e.preventDefault(); e.stopPropagation(); if(!confirm(t('delConfirm'))) return; try { const res = await fetch('/api/links'); let links = res.ok ? await res.json() : JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); links.splice(index, 1); await fetch('/api/links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(links) }); localStorage.setItem('nav_custom_links', JSON.stringify(links)); if(links.length <= 9) isCustomLinksExpanded = false; loadCustomLinks(); } catch(error) { const links = JSON.parse(localStorage.getItem('nav_custom_links') || '[]'); links.splice(index, 1); localStorage.setItem('nav_custom_links', JSON.stringify(links)); if(links.length <= 9) isCustomLinksExpanded = false; loadCustomLinks(); } }

        function loadFriendLinks() {
            const container = document.getElementById('friend-links-container'); let linksStr = localStorage.getItem('nav_friend_links'); let links = linksStr ? JSON.parse(linksStr) : []; container.innerHTML = '';
            if(links.length === 0) { links = [ { name: "IT头条博客", url: "https://it-toutiao.blogspot.com" }, { name: "科技共享导航", url: "https://kjgx.168668520.xyz" } ]; }
            links.forEach((item, index) => {
                const displayName = getLocalizedLinkName(item.name, item.url);
                const displayIcon = createLinkIcon(item, displayName, 'w-4 h-4', 'text-[8px]');
                const isTextItem = item.type === 'text';
                const itemContent = isTextItem
                    ? `<button type="button" onclick="openTextViewer('friend', ${index})" class="w-full flex items-center justify-center gap-1.5 text-xs font-medium text-amber-300 hover:text-amber-200 truncate pl-2 pr-12">${displayIcon}<span class="truncate">${displayName}</span></button>`
                    : `<a href="${item.url}" draggable="false" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center gap-1.5 text-xs font-medium text-slate-400 hover:text-emerald-400 transition-colors truncate pl-2 pr-12">${displayIcon}<span class="truncate">${displayName}</span></a>`;
                const editAction = isTextItem
                    ? `openTextEditor('friend', ${index})`
                    : `openEditLinkModal(event, 'friend', '', ${index})`;
                container.innerHTML += `
                    <div class="group relative flex items-center justify-between p-2.5 bg-slate-500/5 border border-slate-500/10 rounded-xl hover:bg-emerald-600/10 transition-all text-center">
                        ${itemContent}
                        <div class="admin-only absolute right-1 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button type="button" aria-label="${isTextItem ? t('editText') : t('modalEditLink')}" onclick="${editAction}" class="text-[10px] text-sky-400 hover:text-sky-300 bg-slate-700/80 px-1 rounded cursor-pointer"><i class="fas fa-pen"></i></button>
                            <button type="button" aria-label="${t('delConfirm')}" onclick="deleteFriendLink(event, ${index})" class="text-[10px] text-slate-500 hover:text-red-400 bg-slate-700/80 px-1 rounded cursor-pointer"><i class="fas fa-times"></i></button>
                        </div>
                    </div>`;
            });
        }
        function deleteFriendLink(e, index) { e.preventDefault(); e.stopPropagation(); let linksStr = localStorage.getItem('nav_friend_links'); let links = linksStr ? JSON.parse(linksStr) : []; if(links.length === 0) { links = [ { name: "IT头条博客", url: "https://it-toutiao.blogspot.com" }, { name: "科技共享导航", url: "https://kjgx.168668520.xyz" } ]; } links.splice(index, 1); localStorage.setItem('nav_friend_links', JSON.stringify(links)); loadFriendLinks(); }

        // --- 初始化运转 ---
        document.addEventListener('click', () => { document.getElementById('engine-menu').classList.add('hidden'); document.getElementById('theme-panel').classList.add('hidden'); });
        document.getElementById('restore-date').value = new Date().toISOString().slice(0, 10);
        checkAdminSession(); document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en'; applyLanguage(); updateClockAndGreeting(); fetchWeather(); initCloudData();
    </script>
</body>
</html>
